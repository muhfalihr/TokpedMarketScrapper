[project]
name = "tokped-market-scrapper"
version = "0.2.0"
requires-python = ">=3.11"

dependencies = [
    "scrapling[fetchers]==0.4.14",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
tokped-scraper = "tokped_market_scrapper.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
extend-ignore = ["B008"]

[tool.ruff]
line-length = 100
target-version = "py311"
